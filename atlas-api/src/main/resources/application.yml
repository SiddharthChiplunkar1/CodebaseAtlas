spring:
  application:
    name: atlas-api

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${SPRING_DATASOURCE_USERNAME:atlas}
    password: ${SPRING_DATASOURCE_PASSWORD:atlas_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema — never let Hibernate modify it
    show-sql: false
    open-in-view: false         # Avoid lazy-loading issues — always use explicit fetching
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 50

  # ── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── Redis ─────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  # ── GitHub OAuth2 ─────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
              - repo

  # ── Spring Batch ──────────────────────────────────────────────────────────
  batch:
    job:
      enabled: false            # Jobs are launched programmatically, not on startup
    jdbc:
      initialize-schema: always # Let Spring Batch create its metadata tables

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ── gRPC Client Configuration ─────────────────────────────────────────────────
grpc:
  client:
    atlas-ai:
      address: 'static://${ATLAS_AI_GRPC_HOST:localhost}:${ATLAS_AI_GRPC_PORT:50051}'
      negotiation-type: plaintext

# ── Atlas custom properties ───────────────────────────────────────────────────
atlas:
  # GitHub API token for repo metadata fetching (personal access token)
  github:
    api-token: ${GITHUB_API_TOKEN:}

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.atlas: DEBUG
    org.springframework.security: INFO
    org.springframework.batch: INFO
    org.hibernate.SQL: WARN
